services:
  - type: web
    name: maritime-q
    runtime: python
    rootDir: web_app/api
    # Build React frontend first, then install Python deps
    buildCommand: >
      cd ../web && npm install && npm run build &&
      cd ../api && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
